<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chạm Việt — kiểm tra responsive</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:8px;display:flex;gap:8px;align-items:center}button,select{padding:8px;font:inherit}iframe{display:block;border:0;margin:auto;background:white;height:844px;width:390px}#report{font-size:12px}</style><header><select aria-label="Kích thước kiểm thử" id="size"><option value="390">Điện thoại 390px</option><option value="360">Điện thoại 360px</option><option value="768">Tablet 768px</option><option value="1280">Desktop 1280px</option></select><button id="check">Kiểm tra tràn ngang</button><span id="report" role="status"></span></header><iframe id="app" title="Chạm Việt responsive" src="/#/explore"></iframe><script>const frame=document.querySelector('#app');document.querySelector('#size').onchange=e=>frame.style.width=e.target.value+'px';document.querySelector('#check').onclick=()=>{const d=frame.contentDocument;document.querySelector('#report').textContent=`Viewport ${d.documentElement.clientWidth}px / Nội dung ${d.documentElement.scrollWidth}px / ${d.documentElement.scrollWidth<=d.documentElement.clientWidth?'Đạt: không tràn ngang':'Lỗi: tràn ngang'}`};</script></html>
